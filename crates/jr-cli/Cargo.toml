[package]
name = "jr-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "jr"
path = "src/main.rs"

[lib]
name = "jr_cli"
path = "src/lib.rs"

[lints]
workspace = true

# Selects the LLVM back end; see `jr-codegen-llvm` and ADR-0143 §1.
[features]
default = []
llvm = ["jr-db/llvm"]

[dependencies]
jr-base.workspace = true
jr-diag.workspace = true
jr-db.workspace = true
jr-link.workspace = true
jr-hir.workspace = true
jr-syntax.workspace = true
jr-fmt.workspace = true
jr-lsp.workspace = true
# `jr bench` builds the `Range` a code-action request carries (ADR-0033 §3).
lsp-types.workspace = true
clap.workspace = true
anyhow.workspace = true
tempfile = "3"

[dev-dependencies]
gimli.workspace = true
object.workspace = true
serde_json.workspace = true
tempfile = "3"
