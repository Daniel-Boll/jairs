[package]
name = "jr-db"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

# Forwarded to `jr-codegen-llvm`, whose LLVM dependency is optional and off by default
# (ADR-0143 §1). `jr build --backend llvm` refuses with a message naming this feature when
# it is off, rather than reporting an unknown argument.
[features]
default = []
llvm = ["dep:jr-codegen-llvm", "jr-codegen-llvm/llvm"]

[dependencies]
jr-base.workspace = true
jr-diag.workspace = true
jr-syntax.workspace = true
jr-hir.workspace = true
jr-pool.workspace = true
jr-sema.workspace = true
jr-mir.workspace = true
jr-vm.workspace = true
jr-codegen.workspace = true
jr-codegen-clif.workspace = true
jr-codegen-llvm = { workspace = true, optional = true }
salsa.workspace = true
rustc-hash.workspace = true

[dev-dependencies]
insta.workspace = true
# Version pinned inline rather than via `[workspace.dependencies]`, matching how `jr-cli`
# already depends on it; it is a test-only dependency of two crates.
tempfile = "3"
jr-hir.workspace = true
jr-mir.workspace = true
