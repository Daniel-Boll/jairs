name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------------
  # fmt — stable rustfmt, no nightly options
  # ---------------------------------------------------------------------------
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check

  # ---------------------------------------------------------------------------
  # clippy — deny all warnings
  # ---------------------------------------------------------------------------
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # ---------------------------------------------------------------------------
  # test — matrix: macOS arm64 (primary) + Linux x86-64 (sanity oracle)
  # ---------------------------------------------------------------------------
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  # ---------------------------------------------------------------------------
  # docs — deny rustdoc warnings
  # ---------------------------------------------------------------------------
  docs:
    name: docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps

  # ---------------------------------------------------------------------------
  # jairs-fmt — the corpus must stay canonical under `jr fmt`
  #
  # The corpus files are the specification's worked examples. Enforcing that
  # they are already formatted keeps the spec and the formatter from drifting
  # apart, and doubles as an end-to-end test of the `jr` binary.
  # ---------------------------------------------------------------------------
  jairs-fmt:
    name: jairs-fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # Only the trees that are meant to be well-formed. `invalid/` files
      # deliberately do not parse, and `jr fmt` correctly refuses to format
      # input it could not parse, so including them would always fail.
      - run: >
          cargo run -p jr-cli -- fmt --check
          tests/corpus/valid
          tests/corpus/imports/valid
          tests/corpus/modules
          modules

  # ---------------------------------------------------------------------------
  # corpus-drift — THE GATE (PLAN.md §2.0 and §5)
  #
  # Every file in tests/corpus/valid/ must parse cleanly in BOTH the Rust
  # compiler and the tree-sitter grammar so the two grammars cannot silently
  # diverge. tests/corpus/invalid/ is deliberately excluded from the
  # tree-sitter side: tree-sitter is not the authority on diagnostics, only on
  # whether well-formed source is recognised.
  #
  # TODAY (skeleton phase):
  #   - tree-sitter-jairs/grammar.js is absent → nothing to generate, exits 0.
  #   - the jr-syntax corpus test target does not exist yet → exits 0.
  #
  # AUTOMATICALLY BECOMES A REAL GATE when those appear.
  # To graduate: delete the two guard blocks marked DELETE-WHEN-READY.
  # ---------------------------------------------------------------------------
  corpus-drift:
    name: corpus-drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: Swatinem/rust-cache@v2

      # ---- tree-sitter side ------------------------------------------------
      - name: tree-sitter grammar check
        shell: bash
        run: |
          set -euo pipefail
          GRAMMAR="tree-sitter-jairs/grammar.js"

          # ── DELETE-WHEN-READY: guard block (tree-sitter side) ──────────────
          if [ ! -f "$GRAMMAR" ]; then
            echo "::notice::corpus-drift (tree-sitter): $GRAMMAR not found — nothing to check yet."
            exit 0
          fi
          # ── END DELETE-WHEN-READY ──────────────────────────────────────────

          npm install -g tree-sitter-cli@0.26.11
          ( cd tree-sitter-jairs && tree-sitter generate )

          # `tree-sitter test` covers the grammar's own S-expression corpus.
          if [ -d tree-sitter-jairs/test/corpus ]; then
            ( cd tree-sitter-jairs && tree-sitter test )
          fi

          # The actual drift gate: every valid corpus file must parse with no
          # ERROR nodes. `tree-sitter parse` exits non-zero if any appear.
          #
          # Every corpus file that is meant to be well-formed must parse with no
          # ERROR nodes: the single-file programs, the multi-module import cases,
          # and the fixture modules they import.
          ( cd tree-sitter-jairs && tree-sitter parse --quiet \
              ../tests/corpus/valid/*.jr \
              ../tests/corpus/imports/valid/*.jr \
              ../tests/corpus/modules/*.jr \
              ../tests/corpus/modules/*/*.jr \
              ../modules/*/*.jr )
          echo "::notice::corpus-drift (tree-sitter): all well-formed corpus files parsed cleanly."

      # ---- compiler side ---------------------------------------------------
      - name: compiler corpus test
        shell: bash
        run: |
          set -euo pipefail

          # ── DELETE-WHEN-READY: guard block (compiler side) ─────────────────
          if [ ! -f crates/jr-syntax/tests/corpus.rs ]; then
            echo "::notice::corpus-drift (compiler): jr-syntax corpus test target does not exist yet — nothing to check."
            exit 0
          fi
          # ── END DELETE-WHEN-READY ──────────────────────────────────────────

          cargo test -p jr-syntax --test corpus
