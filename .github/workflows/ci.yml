name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------------
  # fmt — stable rustfmt, no nightly options
  # ---------------------------------------------------------------------------
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all --check

  # ---------------------------------------------------------------------------
  # clippy — deny all warnings
  # ---------------------------------------------------------------------------
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  # ---------------------------------------------------------------------------
  # test — matrix: macOS arm64 (primary) + Linux x86-64 (sanity oracle)
  # ---------------------------------------------------------------------------
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # The differential harness *links* every program in `tests/corpus/valid/`, so this leg needs
      # every system library the corpus reaches. macOS ships them all; Linux does not.
      #
      # **Only OpenGL, and only because one program needs it.** `tests/corpus/valid/137` imports
      # `modules/GL` to call `gl_library_for`, a compile-time text function — it never calls an
      # OpenGL routine, but importing a module that declares a library links that library, so
      # `-lGL` is on the line either way. Without the package: `cannot find -lGL` (ADR-0205 §4b).
      #
      # **SDL2 is deliberately not installed.** Nothing in `valid/` reaches `Window`, `Simp`,
      # `Input`, `Image` or `UI` — verified, not assumed — and installing a library nothing needs is
      # the same mistake as naming one nothing contains. The day a corpus program imports one of
      # those, this step needs `libsdl2-dev` and the failure will say so.
      - name: system libraries the corpus links
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev
      - run: scripts/check full --locked

  # ---------------------------------------------------------------------------
  # docs — deny rustdoc warnings
  # ---------------------------------------------------------------------------
  docs:
    name: docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --locked --workspace --no-deps

  # ---------------------------------------------------------------------------
  # jairs-fmt — the corpus must stay canonical under `jr fmt`
  #
  # The corpus files are the specification's worked examples. Enforcing that
  # they are already formatted keeps the spec and the formatter from drifting
  # apart, and doubles as an end-to-end test of the `jr` binary.
  # ---------------------------------------------------------------------------
  jairs-fmt:
    name: jairs-fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # Only the trees that are meant to be well-formed. `invalid/` files
      # deliberately do not parse, and `jr fmt` correctly refuses to format
      # input it could not parse, so including them would always fail.
      # `type-errors/` and `cfg-errors/` DO belong here: those files parse
      # cleanly and are rejected later, by the type checker and by MIR's
      # control-flow analysis respectively.
      - run: >
          cargo run --locked -p jr-cli -- fmt --check
          tests/corpus/valid
          tests/corpus/imports/valid
          tests/corpus/type-errors
          tests/corpus/cfg-errors
          tests/corpus/modules
          modules
          tests/fixtures

  # ---------------------------------------------------------------------------
  # corpus-drift — THE GATE (PLAN.md §2.0 and §5)
  #
  # Every file in tests/corpus/valid/ must parse cleanly in the tree-sitter
  # grammar. The authoritative full test jobs already exercise the Rust parser,
  # so this job owns only tree-sitter and editor-query drift. tests/corpus/invalid/
  # is deliberately excluded: tree-sitter is not the authority on diagnostics,
  # only on whether well-formed source is recognised.
  #
  # ---------------------------------------------------------------------------
  corpus-drift:
    name: corpus-drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tree-sitter-jairs/package-lock.json

      - name: install pinned tree-sitter CLI
        run: npm ci --prefix tree-sitter-jairs

      # ---- tree-sitter side ------------------------------------------------
      - name: tree-sitter grammar check
        shell: bash
        run: |
          set -euo pipefail

          ( cd tree-sitter-jairs && ./node_modules/.bin/tree-sitter generate )

          # `tree-sitter test` covers the grammar's own S-expression corpus.
          if [ -d tree-sitter-jairs/test/corpus ]; then
            ( cd tree-sitter-jairs && ./node_modules/.bin/tree-sitter test )
          fi

          # The actual drift gate: every valid corpus file must parse with no
          # ERROR nodes. `tree-sitter parse` exits non-zero if any appear.
          #
          # Every corpus file that is meant to be well-formed must parse with no
          # ERROR nodes: the single-file programs, the multi-module import cases,
          # the fixture modules they import, and the type-error and cfg-error
          # programs — those are well-formed source that only a later phase
          # rejects.
          ( cd tree-sitter-jairs && ./node_modules/.bin/tree-sitter parse --quiet \
              ../tests/corpus/valid/*.jr \
              ../tests/corpus/imports/valid/*.jr \
              ../tests/corpus/type-errors/*.jr \
              ../tests/corpus/cfg-errors/*.jr \
              ../tests/corpus/modules/*.jr \
              ../tests/corpus/modules/*/*.jr \
              ../modules/*/*.jr \
              ../tests/fixtures/*/*/*.jr )
          echo "::notice::corpus-drift (tree-sitter): all well-formed corpus files parsed cleanly."

          # Every query file must compile against the grammar. This is not
          # thoroughness: a query naming a node `grammar.js` does not have was
          # previously undetectable, and the failure is *silent* — highlighting
          # simply stops. `tree-sitter query` exits 1 with `Invalid node type`,
          # which is the only thing that catches it (ADR-0025 §4).
          #
          # The queries `editors/nvim/queries/jairs/` ships are symlinks to these
          # files, so validating them here validates what an editor loads.
          for q in highlights folds indents locals; do
            ( cd tree-sitter-jairs && ./node_modules/.bin/tree-sitter query "queries/$q.scm" \
                ../tests/corpus/valid/024-hello.jr > /dev/null )
          done
          echo "::notice::corpus-drift (tree-sitter): all four query files compile against the grammar."

          editors/zed/generate-queries.sh
          for q in highlights brackets indents outline; do
            ( cd tree-sitter-jairs && ./node_modules/.bin/tree-sitter query \
                "../editors/zed/languages/jairs/$q.scm" \
                ../tests/corpus/valid/024-hello.jr > /dev/null )
          done
          echo "::notice::corpus-drift (Zed): all four query files compile against the grammar."

          git diff --exit-code -- \
            tree-sitter-jairs/src/parser.c \
            editors/zed/languages/jairs/highlights.scm
