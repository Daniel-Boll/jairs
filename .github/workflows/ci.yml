name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------------
  # fmt — stable rustfmt, no nightly options
  # ---------------------------------------------------------------------------
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check

  # ---------------------------------------------------------------------------
  # clippy — deny all warnings
  # ---------------------------------------------------------------------------
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # ---------------------------------------------------------------------------
  # test — matrix: macOS arm64 (primary) + Linux x86-64 (sanity oracle)
  # ---------------------------------------------------------------------------
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  # ---------------------------------------------------------------------------
  # docs — deny rustdoc warnings
  # ---------------------------------------------------------------------------
  docs:
    name: docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps

  # ---------------------------------------------------------------------------
  # corpus-drift — THE GATE (PLAN.md §2.0 and §5)
  #
  # Every file in tests/corpus/*.jr must parse cleanly in BOTH the Rust
  # compiler and the tree-sitter grammar so the two grammars cannot silently
  # diverge.
  #
  # TODAY (skeleton phase):
  #   - tests/corpus/ is empty  → nothing to check, exits 0.
  #   - tree-sitter-jairs/grammar.js is absent → nothing to generate, exits 0.
  #
  # AUTOMATICALLY BECOMES A REAL GATE when:
  #   - tree-sitter-jairs/grammar.js exists  (tree-sitter side activates)
  #   - tests/corpus/*.jr files exist        (compiler side activates)
  #
  # To graduate from skeleton to gate: delete the two guard blocks below
  # (marked DELETE-WHEN-READY) and ensure the corpus test binary exists.
  # ---------------------------------------------------------------------------
  corpus-drift:
    name: corpus-drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: Swatinem/rust-cache@v2

      # ---- tree-sitter side ------------------------------------------------
      - name: tree-sitter grammar check
        shell: bash
        run: |
          GRAMMAR="tree-sitter-jairs/grammar.js"

          # ── DELETE-WHEN-READY: guard block (tree-sitter side) ──────────────
          if [ ! -f "$GRAMMAR" ]; then
            echo "::notice::corpus-drift (tree-sitter): $GRAMMAR not found — nothing to check yet."
            echo "SKIP_TS=1" >> "$GITHUB_ENV"
          fi
          # ── END DELETE-WHEN-READY ──────────────────────────────────────────

          if [ "${SKIP_TS:-0}" = "0" ]; then
            npm install -g tree-sitter-cli@0.26.11
            cd tree-sitter-jairs
            tree-sitter generate
            tree-sitter test
          fi

      # ---- compiler side ---------------------------------------------------
      - name: compiler corpus test
        shell: bash
        run: |
          CORPUS_DIR="tests/corpus"

          # ── DELETE-WHEN-READY: guard block (compiler side) ─────────────────
          # Use `ls` rather than a glob so the check works even when the shell
          # has nullglob/failglob disabled (bash on Ubuntu has neither by default,
          # but this is more explicit and portable).
          if [ -z "$(ls "$CORPUS_DIR"/*.jr 2>/dev/null)" ]; then
            echo "::notice::corpus-drift (compiler): $CORPUS_DIR is empty — nothing to check yet."
            exit 0
          fi
          # ── END DELETE-WHEN-READY ──────────────────────────────────────────

          # When corpus files exist, run the dedicated corpus test binary.
          # The binary is expected to be registered in the workspace as a
          # [[test]] target (e.g. in jr-syntax or a top-level tests/ crate).
          cargo test --test corpus -- --nocapture
