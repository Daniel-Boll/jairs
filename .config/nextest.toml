nextest-version = "0.9.127"

[profile.default]
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 2 }
status-level = "slow"
final-status-level = "fail"

[profile.fast]
default-filter = """
not binary(differential)
and not test(/every_prefix_of_every_corpus_file_round_trips_shard_/)
"""

[profile.pre-commit]
default-filter = """
not test(/every_corpus_program_behaves_identically_in_both_engines_shard_/)
and not test(/every_corpus_program_behaves_identically_in_all_three_engines_shard_/)
and not test(/every_prefix_of_every_corpus_file_round_trips_shard_/)
"""

[test-groups.differential]
max-threads = 4

[test-groups.graphics]
max-threads = 1

[[profile.default.overrides]]
filter = "binary(differential)"
test-group = "differential"

[[profile.default.overrides]]
filter = """
test(/a_window_opens_and_draws_through_sdl2/)
or test(/an_event_loop_reads_the_sdl_event_union/)
or test(/an_immediate_mode_button_fires_on_release_inside/)
or test(/a_bmp_round_trips_into_a_texture/)
or test(/the_simp_stack_draws_a_frame_end_to_end/)
or test(/a_rotated_textured_quad_draws_through_render_geometry/)
"""
test-group = "graphics"
